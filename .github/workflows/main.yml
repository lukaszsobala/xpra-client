name: Android CI

on:
  push:
  pull_request:

jobs:
  build:

    # pinned, so that the image (and its preinstalled Android SDK) only changes on purpose:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # the open source (MIT) cache, rather than the proprietary "enhanced" one
          cache-provider: basic
      - name: Build and run unit tests
        run: ./gradlew assembleDebug test
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: xpra-client-android-debug
          path: xpra-client-android/build/outputs/apk/debug/*.apk
