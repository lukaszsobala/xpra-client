apply plugin: 'java-library'
apply plugin: 'kotlin'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation 'com.github.jksiezni:bee-encode:0.3'
    implementation 'com.github.jksiezni:rencode4j:1.2.0'

    api 'org.slf4j:slf4j-api:1.7.36'
    // Maintained fork of JSch (same com.jcraft.jsch API) supporting modern
    // OpenSSH key and signature algorithms (ed25519, rsa-sha2-*)
    api 'com.github.mwiede:jsch:0.2.25'

    testImplementation 'junit:junit:4.13.2'
}
