apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

ext {
    versionMajor = 1
    versionMinor = 0
    // CI builds are numbered, so that each APK can be installed over the previous one
    buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
    // The key which signs the release bundles uploaded to Google Play (the upload key, as Play
    // signs the apps it delivers with a key of its own). It must never be in the repository:
    // it comes from the environment, ie: the secrets of GitHub Actions, or from
    // ~/.gradle/gradle.properties, see docs/releasing.md
    uploadKey = { String name -> System.getenv(name) ?: project.findProperty(name) }
}
// assert versionMinor and buildNumber fit in their digits of versionCode
assert ext.versionMinor < 100
assert ext.buildNumber < 10000

version = "${ext.versionMajor}.${ext.versionMinor}.${ext.buildNumber}"
base.archivesName = "${project.name}-$version"

android {
    namespace 'com.github.jksiezni.xpra'
    compileSdk 36

    defaultConfig {
        applicationId "io.github.lukaszsobala.xpra"
        minSdk 23
        targetSdk 36
        versionCode = versionMajor * 1000000 + versionMinor * 10000 + buildNumber
        versionName version

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        // A fixed debug key, shared by all builds, so that updates can be installed over each other.
        // Without it, every CI runner signs with its own randomly generated debug key.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def storePath = uploadKey("XPRA_UPLOAD_STORE_FILE")
            if (storePath) {
                storeFile file(storePath)
                storePassword uploadKey("XPRA_UPLOAD_STORE_PASSWORD")
                keyAlias uploadKey("XPRA_UPLOAD_KEY_ALIAS")
                keyPassword uploadKey("XPRA_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // without the upload key, ie: on forks or pull requests, the bundle is left unsigned
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    buildFeatures {
        viewBinding true
        // BuildConfig.DEBUG: release builds log less, see XpraApplication
        buildConfig true
    }
    packaging {
        resources {
            // OSGi/JPMS metadata of multi-release jars (JSch, JSpecify), unused on Android
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/versions/*/module-info.class']
        }
    }
}

// Google Play refuses a version code it has seen already: signed bundles need a build number,
// which CI gives them (or GITHUB_RUN_NUMBER, set by hand)
gradle.taskGraph.whenReady { graph ->
    if (android.signingConfigs.release.storeFile != null && buildNumber == 0 &&
            graph.allTasks.any { it.path == "${project.path}:bundleRelease" }) {
        throw new GradleException("A signed release bundle needs a build number: set GITHUB_RUN_NUMBER")
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':xpra-common')
    implementation project(':3rdparty:grafika')
    def coroutines_version = '1.10.2'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-rx2:$coroutines_version"

    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.6'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.transition:transition:1.5.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    def lifecycle_version = "2.9.0"
    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    // LiveData
    //implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    // Lifecycles only (without ViewModel or LiveData)
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // Saved state module for ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"

    // Recycler View
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    // the icons of the server's applications are often SVG images
    implementation 'com.caverock:androidsvg-aar:1.4'
    //implementation 'androidx.recyclerview:recyclerview-selection:1.0.0'

    def room_version = "2.7.1"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava2:$room_version"

    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxkotlin:2.4.0'

    implementation 'com.google.guava:guava:33.4.8-android'

    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.arcao:slf4j-timber:3.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.15.1'

    // Android Test deps
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'org.mockito:mockito-android:5.18.0'
}
